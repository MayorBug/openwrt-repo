# ONE-OFF, to be deleted again: copy this feed's signing secrets into the
# add-on feed, which was split out of this repository on 2026-10-04 and has to
# sign its indexes with the SAME key — a device trusts one public key and must
# not need a second.
#
# Why a workflow at all: GitHub secrets are write-only, nobody can read
# PRIVATE_KEY back out, not even its owner. A job that HAS the secret can hand
# it to the GitHub API of the other repository, so the value never leaves
# GitHub and never reaches a log (nothing prints it, and it is masked anyway).
#
# Needs COPY_PAT: a fine-grained PAT with "Secrets: read and write" on the
# target repository. Afterwards delete that secret, this file, and take the
# permission off the PAT again.
name: copy-secrets

on:
  workflow_dispatch:
    inputs:
      target:
        description: repository to copy PRIVATE_KEY and KEY_BUILD into
        required: true
        default: ddimension/openwrt-addon-feed

jobs:
  copy:
    # GitHub-hosted on purpose: free for a public repository, and the
    # self-hosted fleet is busy building.
    runs-on: ubuntu-latest
    steps:
      - name: Copy the signing secrets
        env:
          GH_TOKEN: ${{ secrets.COPY_PAT }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::COPY_PAT is not set in this repository"; exit 1; }
          [ -n "${PRIVATE_KEY:-}" ] || { echo "::error::PRIVATE_KEY is empty"; exit 1; }
          printf '%s' "$PRIVATE_KEY" | gh secret set PRIVATE_KEY -R "$TARGET"
          echo "PRIVATE_KEY -> $TARGET"
          if [ -n "${KEY_BUILD:-}" ]; then
            printf '%s' "$KEY_BUILD" | gh secret set KEY_BUILD -R "$TARGET"
            echo "KEY_BUILD -> $TARGET"
          else
            echo "::warning::KEY_BUILD is empty here, nothing copied"
          fi
          gh secret list -R "$TARGET"
